# CF-05 (#61): the chronos-t5-small architecture from random initialization (random_init: true) with the CF-01
# recipe at lr 1e-5, the positive control for the fine-tuning result: the same pipeline, data and steps without
# the pretrained weights. slurm/chronos_ft.sbatch trains and scores it like the fine-tunes.
training_data_paths:
- data/sdwpf/chronos_nan/train_5pct.arrow
probability:
- 1.0
# DS-02 windows: L = 288, H = 64; min_past = context_length so every sampled window has full history
context_length: 288
prediction_length: 64
min_past: 288
# Learning-rate pilot: the paper recipe (1000 steps, batch 32, linear decay) at lr 1e-5 instead of 1e-3
max_steps: 1000
save_steps: 250
log_steps: 50
per_device_train_batch_size: 32
gradient_accumulation_steps: 1
learning_rate: 0.00001
lr_scheduler_type: linear
warmup_ratio: 0.0
model_id: amazon/chronos-t5-small
model_type: seq2seq
random_init: true
tf32: true
torch_compile: false
dataloader_num_workers: 1
seed: 2021
output_dir: output/chronos/chronos_scratch_5pct_lr1e-5_nan
