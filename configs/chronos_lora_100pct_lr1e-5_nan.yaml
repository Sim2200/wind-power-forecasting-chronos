# CF-02: LoRA fine-tuning of Chronos on the DS-03 Arrow export (chronos_nan/train_100pct.arrow).
# Run with: python scripts/train_lora.py --config <this file> --rank 8 (slurm/chronos_lora.sbatch does that and then
# scores the merged checkpoint-final with wpf.chronos_eval). A plain train.py config: the LoRA settings are CLI flags.
training_data_paths:
- data/sdwpf/chronos_nan/train_100pct.arrow
probability:
- 1.0
# DS-02 windows: L = 288, H = 64; min_past = context_length so every sampled window has full history
context_length: 288
prediction_length: 64
min_past: 288
# The CF-01 recipe (1000 steps, batch 32, linear decay) at lr 1e-5 (the full fine-tuning rate of the grid)
max_steps: 1000
save_steps: 250
log_steps: 50
per_device_train_batch_size: 32
gradient_accumulation_steps: 1
learning_rate: 0.00001
lr_scheduler_type: linear
warmup_ratio: 0.0
model_id: amazon/chronos-t5-small
model_type: seq2seq
random_init: false
tf32: true
torch_compile: false
dataloader_num_workers: 1
seed: 2021
output_dir: output/chronos/chronos_lora_100pct_lr1e-5_nan
