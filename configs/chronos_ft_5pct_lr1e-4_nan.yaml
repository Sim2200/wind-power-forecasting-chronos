# CF-01: full fine-tuning of Chronos on the DS-03 Arrow export (chronos_nan/train_5pct.arrow).
# Run from the chronos-forecasting clone: python scripts/training/train.py --config <this file>
# (slurm/chronos_ft.sbatch does that and then scores checkpoint-final with wpf.chronos_eval).
training_data_paths:
- data/sdwpf/chronos_nan/train_5pct.arrow
probability:
- 1.0
# DS-02 windows: L = 288, H = 64; min_past = context_length so every sampled window has full history
context_length: 288
prediction_length: 64
min_past: 288
# Learning-rate pilot: the paper recipe (1000 steps, batch 32, linear decay) at lr 1e-4 instead of 1e-3
max_steps: 1000
save_steps: 250
log_steps: 50
per_device_train_batch_size: 32
gradient_accumulation_steps: 1
learning_rate: 0.0001
lr_scheduler_type: linear
warmup_ratio: 0.0
model_id: amazon/chronos-t5-small
model_type: seq2seq
random_init: false
tf32: true
torch_compile: false
dataloader_num_workers: 1
seed: 2021
output_dir: output/chronos/chronos_ft_5pct_lr1e-4_nan
